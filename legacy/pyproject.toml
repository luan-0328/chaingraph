# ===========================================================
# AI 智能工单处理平台 —— 项目清单（PEP 621 标准格式）
#
# 这个文件是项目依赖的"唯一入口"（uv / pip 都认它）：
#     uv add <包名>         → 加进 dependencies，并更新 uv.lock、装进 .venv
#     uv remove <包名>      → 移除依赖
#     uv add --dev <包名>   → 加到下面的 [dependency-groups] dev 组（测试等工具）
#     uv sync               → 按本文件 + uv.lock 把 .venv 装成一致状态
#     uv lock               → 只重新解析版本，生成/更新 uv.lock
#
# requirements.txt 仍然保留，供不用 uv 的场景（pip install -r）使用；
# 日常开发以本文件为准，避免两个文件各写一份导致不一致。
#
# 注意：本文件只声明"直接依赖"。精确到小版本的完整依赖树记录在 uv.lock 里。
# ===========================================================

[project]
name = "ai-ticket-agent"
version = "0.1.0"
description = "AI 智能工单处理平台：FastAPI + MySQL + LangGraph + LLM（第一阶段骨架）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # ---------- Web 层 ----------
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # ---------- 数据库层（第一阶段只搭架子） ----------
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "cryptography>=42.0",        # MySQL 8 的 caching_sha2_password 认证需要它
    # ---------- Agent 层 ----------
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",     # 通过 OpenAI 兼容协议调用 DeepSeek 等模型
    "langgraph>=0.2",
    # ---------- 配置 ----------
    "python-dotenv>=1.0",
    "pyjwt>=2.14.0",
]

[tool.uv]
# 这是一个"应用"，不是要发布或安装的库：
# 告诉 uv 不要把项目本身当包来构建/安装（代码是 app/ 目录，从项目根目录导入即可）。
package = false

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true
